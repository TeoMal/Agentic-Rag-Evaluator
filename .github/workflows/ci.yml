# Continuous Integration -- runs on every pull request into main (and on demand).
#
#   1. lint + unit tests, installed exactly as uv.lock pins them
#   2. build the production image and prove it boots: /health must answer with
#      the image tag this run built
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (fails if uv.lock is stale)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest -q

  image:
    name: Build image and smoke-test it
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hackathon2-app:ci
          build-args: IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and check /health
        env:
          EXPECTED_TAG: ${{ github.sha }}
        run: |
          docker run -d --name app -p 8000:8000 hackathon2-app:ci
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:8000/health); then
              echo "$body" | jq .
              echo "$body" | jq -e --arg tag "$EXPECTED_TAG" '.image_tag == $tag' > /dev/null && exit 0
            fi
            sleep 2
          done
          echo "::error::container did not report image_tag=$EXPECTED_TAG within 60s"
          docker logs app
          exit 1
