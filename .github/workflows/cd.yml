# Continuous Deployment -- every push to main (i.e. every merged PR) goes to
# Azure Container Apps, after CI passes.
#
# The deploy step is the SAME script developers run locally
# (`uv run scripts/deploy.py azure`), so CI and laptops cannot drift apart:
# Bicep infra -> build -> push to ACR -> roll out -> verify /health reports this SHA.
#
# One-time setup (see deployment/README.md):
#   secrets  AZURE_CREDENTIALS      service principal JSON (az ad sp create-for-rbac --sdk-auth)
#            AZURE_OPENAI_API_KEY
#            AZURE_OPENAI_ENDPOINT
#   vars     (optional) AZURE_RESOURCE_GROUP, AZURE_LOCATION, AZURE_CONTAINERAPP_NAME,
#            AZURE_ACR_NAME, OPENAI_API_VERSION, AZURE_OPENAI_DEPLOYMENT_NAME,
#            AZURE_OPENAI_EMBEDDING_DEPLOYMENT
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Queue deploys; never cancel one halfway through a rollout.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Azure Container Apps
    needs: ci
    runs-on: ubuntu-latest
    # A GitHub environment: add "required reviewers" to it for a manual approval gate.
    environment: production
    env:
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION || '2024-12-01-preview' }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_DEPLOYMENT_NAME || 'gpt-4.1-mini' }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-hackathon2' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'germanywestcentral' }}
      AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME || 'hackathon2-app' }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Deploy (infra, build, push, roll out, verify)
        # Tests already ran in the ci job; the tag is the full commit SHA.
        run: uv run scripts/deploy.py azure --yes --skip-tests --tag "${{ github.sha }}"

      - name: Keep the deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log-${{ github.sha }}
          path: logs/
          include-hidden-files: false
          if-no-files-found: ignore
